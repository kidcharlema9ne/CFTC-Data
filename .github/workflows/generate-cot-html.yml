name: Generate COT HTML report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install pandas numpy

      - name: Verify required COT archives
        shell: bash
        run: |
          set -euo pipefail
          test -s data/raw/legacy_fut/deacot1986_2016.zip
          for year in $(seq 2017 2026); do
            test -s "data/raw/legacy_fut/deacot${year}.zip"
          done

      - name: Run unchanged report script
        run: python3 scripts/cot_report.py

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: COT_Report_latest
          path: reports/COT_Report_latest.html
          if-no-files-found: error
          retention-days: 30
