name: IG client sentiment

on:
  workflow_dispatch:
    inputs:
      save_to_history:
        description: "Save this run to the daily history? (leave off for a one-off look)"
        type: boolean
        default: false
  schedule:
    # Every weekday (Mon-Fri) at 4:00pm US Eastern. GitHub cron is UTC-only, so there are two entries;
    # the gate step below lets only the one that is really 4pm Eastern do the work
    # (21:07 UTC in winter / EST, 20:07 UTC in summer / EDT; off the top of the hour because GitHub drops top-of-hour runs). GitHub can start scheduled
    # jobs a few minutes late.
    - cron: "7 20 * * 1-5"
    - cron: "7 21 * * 1-5"

permissions:
  contents: write
  issues: write

concurrency:
  group: ig-sentiment
  cancel-in-progress: false

jobs:
  sentiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Gate - only 4pm Eastern for scheduled runs
        id: gate
        run: |
          hour=$(TZ=America/New_York date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$hour" != "16" ]; then
            echo "It is $hour:00 Eastern, not 4pm. Skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
          # scheduled 4pm runs are the official daily reading; hand runs are one-offs unless told otherwise
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.save_to_history }}" = "true" ]; then
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          else
            echo "mode=manual" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"

      - name: Install headless browser
        if: steps.gate.outputs.go == 'true'
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Scrape IG client sentiment
        if: steps.gate.outputs.go == 'true'
        run: |
          flag=""
          [ "${{ steps.gate.outputs.mode }}" = "manual" ] && flag="--manual"
          python scripts/ig_sentiment.py --email-body /tmp/ig_email.md --pdf $flag
          # hand runs send no email: keep the table in the repo so an assistant can show it in the chat
          [ "$flag" = "--manual" ] && cp /tmp/ig_email.md reports/IG_Sentiment_manual.md || true

      - name: Commit new data
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ig_sentiment reports/IG_Sentiment_latest.html reports/IG_Sentiment_latest.pdf reports/IG_Sentiment_manual.html reports/IG_Sentiment_manual.pdf reports/IG_Sentiment_manual.md
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "IG sentiment $(date -u +%F)"
            # the COT download job also pushes to this branch, so catch up first
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Email the report (daily runs only; GitHub emails the repo owner about this comment)
        if: steps.gate.outputs.go == 'true' && steps.gate.outputs.mode == 'daily'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.gate.outputs.mode }}
        run: |
          page=latest; note="(one page, full 20 days, shaded)"
          if [ "$MODE" = "manual" ]; then page=manual; note="- MANUAL RUN, not saved to the daily history"; fi
          title="IG Bank Customer Positioning - daily report"
          num=$(gh issue list --state open --search "$title in:title" --json number,title \
                --jq "map(select(.title==\"$title\"))[0].number // empty")
          if [ -z "$num" ]; then
            num=$(gh issue create --title "$title" \
                  --body "Daily report comments appear below. Each one emails @${{ github.repository_owner }}." \
                  | grep -o '[0-9]*$')
          fi
          { echo "@${{ github.repository_owner }}"; echo; echo "**[Open the PDF report](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/reports/IG_Sentiment_${page}.pdf)** $note"; echo; cat /tmp/ig_email.md; } > /tmp/ig_comment.md
          gh issue comment "$num" --body-file /tmp/ig_comment.md
