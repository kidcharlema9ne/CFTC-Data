name: IG client sentiment

on:
  workflow_dispatch:
    inputs:
      save_to_history:
        description: "Save this run to the daily history? (leave off for a one-off look)"
        type: boolean
        default: false
  schedule:
    # Goal: one official reading every weekday, right after 4:00pm US Eastern.
    # GitHub's scheduler is best-effort and sometimes silently drops or delays scheduled runs, so instead of
    # one 4pm entry there are backup attempts every 30 minutes (at :07 and :37, off the top of the hour because
    # GitHub drops top-of-hour runs) from 20:00-23:59 UTC. That covers 4pm-7pm Eastern in winter (EST, UTC-5)
    # and in summer (EDT, UTC-4).
    # Each attempt first checks: is it a weekday, is it 4pm Eastern or later, and has today's reading already
    # been saved? If today is already done (or it is too early), the attempt stops in a few seconds.
    - cron: "7,37 20-23 * * 1-5"

permissions:
  contents: write
  issues: write

concurrency:
  group: ig-sentiment
  cancel-in-progress: false

jobs:
  sentiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Gate - decide whether this run should do the work
        id: gate
        run: |
          event="${{ github.event_name }}"
          hour=$(TZ=America/New_York date +%H)
          dow=$(TZ=America/New_York date +%u)   # 1=Mon ... 7=Sun
          today=$(TZ=America/New_York date +%F)
          go=true
          if [ "$event" = "schedule" ]; then
            if [ "$dow" -ge 6 ]; then
              echo "Weekend in New York. Skipping."; go=false
            elif [ $((10#$hour)) -lt 16 ]; then
              echo "It is $hour:xx Eastern, before 4pm. Skipping."; go=false
            else
              # date (New York) of the newest saved reading in the history
              last_utc=$(tail -n 1 data/ig_sentiment/history.csv | cut -d, -f1)
              last_day=""
              [ -n "$last_utc" ] && last_day=$(TZ=America/New_York date -d "$last_utc UTC" +%F 2>/dev/null || true)
              if [ "$last_day" = "$today" ]; then
                echo "Today's reading ($today) is already saved. Skipping."; go=false
              fi
            fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "today=$today" >> "$GITHUB_OUTPUT"
          # scheduled runs are the official daily reading; hand runs are one-offs unless told otherwise
          if [ "$event" = "schedule" ] || [ "${{ inputs.save_to_history }}" = "true" ]; then
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          else
            echo "mode=manual" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"

      - name: Install headless browser
        if: steps.gate.outputs.go == 'true'
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Scrape IG client sentiment
        if: steps.gate.outputs.go == 'true'
        run: |
          flag=""
          [ "${{ steps.gate.outputs.mode }}" = "manual" ] && flag="--manual"
          python scripts/ig_sentiment.py --email-body /tmp/ig_email.md --pdf $flag
          # hand runs send no email: keep the table in the repo so an assistant can show it in the chat
          [ "$flag" = "--manual" ] && cp /tmp/ig_email.md reports/IG_Sentiment_manual.md || true

      - name: Commit new data
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ig_sentiment reports/IG_Sentiment_latest.html reports/IG_Sentiment_latest.pdf reports/IG_Sentiment_manual.html reports/IG_Sentiment_manual.pdf reports/IG_Sentiment_manual.md
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "IG sentiment $(date -u +%F)"
            # the COT download job also pushes to this branch, so catch up first
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Email the report (daily runs only; a NEW issue each day so every email has its own subject)
        if: steps.gate.outputs.go == 'true' && steps.gate.outputs.mode == 'daily'
        env:
          GH_TOKEN: ${{ github.token }}
          TODAY: ${{ steps.gate.outputs.today }}
        run: |
          page=latest; note="(one page, full 20 days, shaded)"
          title="IG Bank Customer Positioning - $TODAY"
          { echo "@${{ github.repository_owner }}"; echo; echo "**[Open the PDF report](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/reports/IG_Sentiment_${page}.pdf)** $note"; echo; cat /tmp/ig_email.md; } > /tmp/ig_comment.md
          # a new issue each day = a new email thread. If this exact day already has an issue (a re-run), comment on it instead.
          num=$(gh issue list --state all --search "\"$title\" in:title" --json number,title \
                --jq "map(select(.title==\"$title\"))[0].number // empty")
          if [ -z "$num" ]; then
            gh issue create --title "$title" --body-file /tmp/ig_comment.md
          else
            gh issue comment "$num" --body-file /tmp/ig_comment.md
          fi
