name: Download CFTC COT data

on:
  workflow_dispatch:
  schedule:
    # CFTC publishes Wednesdays and Fridays at 3:30pm ET (twice weekly starting
    # December 2026; Friday-only before that, so the Wednesday run is a harmless
    # no-op until then). GitHub cron is UTC-only, so each day has two entries:
    # 20:30 UTC = 4:30pm EDT and 21:30 UTC = 4:30pm EST. The other entry fires
    # an hour off (a harmless retry). The script only commits if data changed.
    - cron: "30 20 * * 3,5"
    - cron: "30 21 * * 3,5"
    # Holiday catch-up: a holiday pushes a release to the next business day.
    - cron: "30 21 * * 1,4"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download COT archives
        run: python scripts/download_cot.py

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update COT data $(date -u +%Y-%m-%d)"
            git push
          fi
