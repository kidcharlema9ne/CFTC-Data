name: Download CFTC COT data

on:
  workflow_dispatch:
  schedule:
    # CFTC publishes Fridays 3:30pm ET (Monday after a holiday). 22:00 UTC is
    # after that in both EST and EDT.
    - cron: "0 22 * * 5,1"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download COT archives
        run: python scripts/download_cot.py

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update COT data $(date -u +%Y-%m-%d)"
            git push
          fi
